# Docs - https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
name: Feature suggestion
description: Suggest a new feature
title: "Enter a title for the suggestion here"
labels: feature request
body:
  - type: markdown
    id: md_readme
    attributes:
      value: |
        ## Important: Read First

        Cidemu is a small project focused on running Wii U games well on Android handhelds. Suggestions that fit that focus have the best chance, for example handheld controls, dual screen devices, power use or ease of setup.

        Changes to the emulation itself, like fixes for a specific game, usually belong to [Cemu](https://github.com/cemu-project/Cemu) and reach Cidemu from there.
  - type: textarea
    id: idea_suggestion
    attributes:
      label: Your suggestion
      description: "Describe what your suggestion is in as much detail as possible"
    validations:
      required: true
