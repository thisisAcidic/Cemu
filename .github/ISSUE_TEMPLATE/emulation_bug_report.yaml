# Docs - https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-githubs-form-schema
name: Bug Report
description: Report an issue with Cidemu
title: "Enter a title for the bug report here"
labels: bug
body:
  - type: markdown
    id: md_readme
    attributes:
      value: |
        ## Important: Read First

        Please make sure of the following first:
        - You are using the latest Cidemu release (the version is shown under *About Cidemu*)
        - The problem isn't already on the [issue tracker](https://github.com/thisisAcidic/Cemu/issues)
        - If you can, check whether the same thing happens in the [Cemu Android port](https://github.com/SSimco/Cemu/releases). That tells us whether it comes from a change in Cidemu

        Please don't report Cidemu problems to the Cemu developers, and never attach game files, keys or console files.
  - type: textarea
    id: current_behavior
    attributes:
      label: Current Behavior
      description: "What the bug is, in a brief description"
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: "How to reproduce the issue, including the game, its region and update version if it is game specific"
    validations:
      required: true
  - type: dropdown
    id: cemu_android_port
    attributes:
      label: Does it happen in the Cemu Android port too?
      options:
        - Not tested
        - "Yes"
        - "No, only in Cidemu"
    validations:
      required: true
  - type: textarea
    id: device_info
    attributes:
      label: Device
      description: "Device, Android version and GPU driver. The driver is either the system driver or the custom driver selected in the graphics settings."
      value: |
        Device:
        Android version:
        GPU driver:
    validations:
      required: true
  - type: textarea
    id: emulation_settings
    attributes:
      label: Emulation Settings (Optional)
      description: |
        Any non-default settings and active graphic packs. You can leave this empty if you didn't change anything other than input settings.
    validations:
      required: false
  - type: textarea
    id: logs_files
    attributes:
      label: "Logs (Optional)"
      description: |
        Attach `log.txt` from right after the problem happened, via *Share log file* in the menu of the game list.
    validations:
      required: false
