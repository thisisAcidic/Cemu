name: Cidemu release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y gettext mono-complete

      - name: Uncompile message catalogs
        run: |
          for mo_file in bin/resources/*/cemu.mo
          do
            language_code=$(basename $(dirname $mo_file))
            po_file=src/android/app/src/main/assets/translations/$language_code/cemu.po
            mkdir -p $(dirname $po_file)
            msgunfmt $mo_file -o $po_file || echo "Failed to uncompile message catalog from $mo_file"
          done

      - name: Setup vcpkg binary cache
        uses: ./.github/actions/set-up-vcpkg-binary-cache-action
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Determine version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^android-v([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags have to look like android-v1.2"
            exit 1
          fi
          echo "EMULATOR_VERSION_MAJOR=${BASH_REMATCH[1]}" >> $GITHUB_ENV
          echo "EMULATOR_VERSION_MINOR=${BASH_REMATCH[2]}" >> $GITHUB_ENV

      - name: Build Cidemu
        env:
          ANDROID_STORE_FILE_BASE64: ${{ secrets.ANDROID_STORE_FILE_BASE64 }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export JAVA_HOME=$JAVA_HOME_21_X64

          cd ./src/android

          if [[ -z "$ANDROID_STORE_FILE_BASE64" ]]; then
            echo "Release signing secrets are missing"
            exit 1
          fi
          base64 --decode <<< "${ANDROID_STORE_FILE_BASE64}" > store.jks
          export ANDROID_STORE_FILE=$(pwd)/store.jks

          ./gradlew assembleRelease

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=${EMULATOR_VERSION_MAJOR}.${EMULATOR_VERSION_MINOR}
          apk=cidemu-$version.apk
          cp src/android/app/build/outputs/apk/release/*.apk $apk
          # release notes are the section of CHANGELOG.md for this version
          awk -v heading="## Cidemu $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "CHANGELOG.md has no section for Cidemu $version"
            exit 1
          fi
          sha256sum $apk > $apk.sha256
          gh release create "$GITHUB_REF_NAME" $apk $apk.sha256 dist/frontends/NintendoWiiU-Cidemu.json --title "Cidemu $version" --notes-file release-notes.md
